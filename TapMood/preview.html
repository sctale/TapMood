<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>一点心情 TapMood</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  background: #F8F6F3;
  color: #2D2D2D;
  display: flex;
  justify-content: center;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* 手机外壳 */
.phone-frame {
  width: 390px;
  min-height: 844px;
  background: #F8F6F3;
  position: relative;
  overflow: hidden;
  box-shadow: 0 24px 80px rgba(0,0,0,0.12);
  border-radius: 44px;
  border: 8px solid #1a1a1a;
  margin: 20px 0;
}

/* 状态栏 */
.status-bar {
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  font-size: 15px;
  font-weight: 600;
}

/* 主内容区 */
.content {
  height: calc(100% - 54px - 72px);
  overflow-y: auto;
  padding-bottom: 24px;
  -webkit-overflow-scrolling: touch;
}
.content::-webkit-scrollbar { display: none; }

/* 卡片 */
.card {
  background: #FFFFFF;
  margin: 12px 16px;
  border-radius: 20px;
  padding: 24px;
  transition: transform 0.2s;
}

/* 今日状态 */
.today-status {
  text-align: center;
  padding: 20px 0 12px;
}
.today-status .greeting {
  font-size: 26px;
  font-weight: 300;
  color: #2D2D2D;
  letter-spacing: 1px;
}
.today-status .sub-greeting {
  font-size: 13px;
  color: #9E9E9E;
  margin-top: 6px;
}
.today-status .emoji { font-size: 52px; margin-bottom: 10px; }
.today-status .status-text { font-size: 18px; font-weight: 600; letter-spacing: 0.5px; }
.today-status .hint { font-size: 11px; color: #BDBDBD; margin-top: 6px; }

/* 连续打卡徽章 */
.streak-badge {
  display: inline-flex;
  align-items: center;
  margin-top: 10px;
  padding: 4px 14px;
  background: #FFF9F5;
  border-radius: 12px;
  font-size: 13px;
  color: #2D2D2D;
  font-weight: 500;
}

/* 心情选择器 */
.mood-selector {
  display: flex;
  justify-content: center;
  gap: 14px;
  padding: 16px 0 8px;
}
.mood-btn {
  width: 104px;
  height: 128px;
  border-radius: 24px;
  border: 1.5px solid #F0EDE8;
  background: #FFFFFF;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  user-select: none;
  position: relative;
}
.mood-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
.mood-btn:active { transform: scale(0.94); }
.mood-btn .emoji { font-size: 44px; }
.mood-btn .label { font-size: 15px; font-weight: 600; margin-top: 4px; letter-spacing: 0.5px; }
.mood-btn .dot {
  width: 6px; height: 6px; border-radius: 3px;
  margin-top: 6px; opacity: 0;
  transition: opacity 0.2s;
}

/* 差 - 柔和靛蓝 */
.mood-btn.bad { border-color: #C5CAE9; }
.mood-btn.bad .label { color: #7986CB; }
.mood-btn.bad.active {
  background: linear-gradient(135deg, #9FA8DA, #5C6BC0);
  border-color: transparent;
  box-shadow: 0 8px 24px rgba(121,134,203,0.3);
}
.mood-btn.bad.active .label { color: #fff; }
.mood-btn.bad.active .dot { background: #fff; opacity: 1; }

/* 中 - 温暖琥珀 */
.mood-btn.okay { border-color: #FFE0B2; }
.mood-btn.okay .label { color: #FFB74D; }
.mood-btn.okay.active {
  background: linear-gradient(135deg, #FFCC80, #FFA726);
  border-color: transparent;
  box-shadow: 0 8px 24px rgba(255,183,77,0.3);
}
.mood-btn.okay.active .label { color: #fff; }
.mood-btn.okay.active .dot { background: #fff; opacity: 1; }

/* 好 - 柔和薄荷绿 */
.mood-btn.good { border-color: #C8E6C9; }
.mood-btn.good .label { color: #81C784; }
.mood-btn.good.active {
  background: linear-gradient(135deg, #A5D6A7, #66BB6A);
  border-color: transparent;
  box-shadow: 0 8px 24px rgba(129,199,132,0.3);
}
.mood-btn.good.active .label { color: #fff; }
.mood-btn.good.active .dot { background: #fff; opacity: 1; }

/* 月度进度 */
.progress-card {
  background: #FFFFFF;
  margin: 8px 16px;
  border-radius: 20px;
  padding: 16px 20px;
}
.progress-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
}
.progress-label { font-size: 13px; color: #9E9E9E; }
.progress-value { font-size: 13px; color: #2D2D2D; font-weight: 600; }
.progress-bar {
  height: 6px;
  background: #F0EDE8;
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #A5D6A7, #66BB6A);
  border-radius: 3px;
  transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* 视图切换标签 */
.view-tabs {
  display: flex;
  background: #F8F6F3;
  border-radius: 12px;
  padding: 3px;
  margin-bottom: 18px;
}
.view-tab {
  flex: 1;
  padding: 8px 0;
  text-align: center;
  border-radius: 10px;
  font-size: 13px;
  color: #9E9E9E;
  cursor: pointer;
  transition: all 0.25s;
  user-select: none;
}
.view-tab.active {
  background: #FFFFFF;
  color: #2D2D2D;
  font-weight: 600;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}

/* 日期导航 */
.date-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
.nav-btn {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  color: #9E9E9E;
  cursor: pointer;
  border-radius: 20px;
  transition: background 0.2s;
  user-select: none;
}
.nav-btn:hover { background: #F0EDE8; }
.calendar-title {
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.5px;
}

/* 月视图 */
.month-view .month-header {
  display: flex;
  justify-content: space-around;
  margin-bottom: 6px;
}
.month-view .month-header span {
  font-size: 11px;
  color: #9E9E9E;
  width: 40px;
  text-align: center;
  font-weight: 500;
}
.month-view .month-row {
  display: flex;
  justify-content: space-around;
  margin-bottom: 4px;
}
.month-view .month-cell {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.month-view .month-circle {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  transition: all 0.2s;
}
.month-view .month-circle:hover { transform: scale(1.08); }
.month-view .month-circle.recorded { color: #fff; font-weight: 600; }
.month-view .month-circle.empty-past { color: #9E9E9E; background: #F0EDE8; }
.month-view .month-circle.empty-future { color: #BDBDBD; background: transparent; }
.month-view .month-circle.today { border: 2px solid #2D2D2D; font-weight: 700; }

/* 周视图 */
.week-view .week-header {
  display: flex;
  justify-content: space-around;
  margin-bottom: 10px;
}
.week-view .week-header span {
  font-size: 11px;
  color: #9E9E9E;
  width: 44px;
  text-align: center;
  font-weight: 500;
}
.week-view .week-days {
  display: flex;
  justify-content: space-around;
}
.week-view .day-block {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  transition: transform 0.2s;
}
.week-view .day-block.empty { background: #F0EDE8; color: #9E9E9E; }
.week-view .day-block.today { border: 2px solid #2D2D2D; font-weight: 700; }

/* 年视图 */
.year-view .year-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
}
.year-view .month-block {
  width: 31%;
  margin-bottom: 16px;
  text-align: center;
}
.year-view .month-block .month-name {
  font-size: 11px;
  color: #9E9E9E;
  font-weight: 500;
  margin-bottom: 6px;
}
.year-view .mini-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-start;
}
.year-view .mini-cell {
  width: 8px;
  height: 8px;
  border-radius: 2px;
  margin: 0.5px;
}

/* 分析页 */
.period-tabs {
  display: flex;
  background: #F8F6F3;
  border-radius: 12px;
  padding: 3px;
}
.period-tab {
  flex: 1;
  padding: 8px 0;
  text-align: center;
  border-radius: 10px;
  font-size: 13px;
  color: #9E9E9E;
  cursor: pointer;
  transition: all 0.25s;
  user-select: none;
}
.period-tab.active {
  background: #FFFFFF;
  color: #2D2D2D;
  font-weight: 600;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}

.chart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}
.chart-header .title { font-size: 18px; font-weight: 600; letter-spacing: 0.5px; }
.chart-toggle {
  display: flex;
  background: #F8F6F3;
  border-radius: 8px;
  padding: 2px;
}
.chart-toggle-btn {
  padding: 5px 14px;
  border-radius: 6px;
  font-size: 12px;
  color: #9E9E9E;
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
}
.chart-toggle-btn.active {
  background: #fff;
  color: #2D2D2D;
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(0,0,0,0.06);
}

/* 饼图 */
.pie-chart {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 0;
}
.pie-svg { position: relative; }
.pie-center {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 24px;
  font-weight: bold;
  color: #2D2D2D;
}
.legend { width: 100%; margin-top: 20px; }
.legend-item {
  display: flex;
  align-items: center;
  margin-bottom: 10px;
  padding: 6px 0;
}
.legend-dot {
  width: 14px;
  height: 14px;
  border-radius: 5px;
  margin-right: 10px;
  flex-shrink: 0;
}
.legend-label { font-size: 14px; flex: 1; color: #2D2D2D; }
.legend-percent { font-size: 14px; color: #9E9E9E; font-weight: 600; }

/* 柱图 */
.bar-chart {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  padding: 20px 0;
  gap: 24px;
  height: 190px;
}
.bar-group {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.bar {
  width: 52px;
  border-radius: 10px;
  transition: height 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  min-height: 4px;
}
.bar-value { font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #2D2D2D; }
.bar-label { font-size: 12px; color: #9E9E9E; margin-top: 10px; }

/* 数据摘要 */
.summary-row {
  display: flex;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid #F8F6F3;
}
.summary-row:last-child { border-bottom: none; }
.summary-label { font-size: 14px; color: #9E9E9E; }
.summary-value { font-size: 14px; font-weight: 600; color: #2D2D2D; }

/* 打卡统计卡片 */
.stats-card-row {
  display: flex;
  margin: 12px 16px;
  gap: 8px;
}
.stats-card {
  flex: 1;
  background: #FFFFFF;
  border-radius: 16px;
  padding: 16px 0;
  text-align: center;
}
.stats-card-value {
  font-size: 28px;
  font-weight: 700;
  color: #2D2D2D;
}
.stats-card-label {
  font-size: 11px;
  color: #9E9E9E;
  margin-top: 4px;
}

/* 温馨小提示 */
.tip-card {
  display: flex;
  align-items: flex-start;
  background: #FFF9F5;
  margin: 12px 16px;
  border-radius: 16px;
  padding: 24px;
  animation: fadeInUp 0.4s ease;
}
.tip-emoji {
  font-size: 28px;
  margin-right: 16px;
  margin-top: 2px;
  flex-shrink: 0;
}
.tip-content { flex: 1; }
.tip-title {
  font-size: 15px;
  font-weight: 600;
  color: #2D2D2D;
  margin-bottom: 4px;
}
.tip-message {
  font-size: 13px;
  color: #9E9E9E;
  line-height: 20px;
}

/* 设置页 */
.setting-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
}
.setting-label { font-size: 16px; color: #2D2D2D; }
.setting-desc { font-size: 12px; color: #9E9E9E; margin-top: 3px; }
.setting-info { flex: 1; }

/* 开关 */
.toggle {
  width: 50px;
  height: 30px;
  border-radius: 15px;
  background: #F0EDE8;
  position: relative;
  cursor: pointer;
  transition: background 0.3s;
}
.toggle.on { background: #81C784; }
.toggle .knob {
  width: 26px;
  height: 26px;
  border-radius: 13px;
  background: #fff;
  position: absolute;
  top: 2px;
  left: 2px;
  transition: left 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}
.toggle.on .knob { left: 22px; }

/* 时间控制 */
.time-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 0;
  border-top: 1px solid #F8F6F3;
  margin-top: 8px;
}
.time-control {
  display: flex;
  align-items: center;
  gap: 14px;
}
.time-btn {
  width: 38px;
  height: 38px;
  border-radius: 19px;
  background: #F8F6F3;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
  color: #2D2D2D;
  transition: background 0.2s;
}
.time-btn:hover { background: #F0EDE8; }
.time-display {
  font-size: 20px;
  font-weight: 600;
  min-width: 64px;
  text-align: center;
  color: #2D2D2D;
}
.version-text { font-size: 14px; color: #9E9E9E; }

/* 底部导航 */
.tab-bar {
  height: 72px;
  background: #FFFFFF;
  border-top: 1px solid #F0EDE8;
  display: flex;
  padding-bottom: 12px;
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
}
.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: color 0.2s;
  color: #BDBDBD;
  user-select: none;
}
.tab-item.active { color: #2D2D2D; }
.tab-item svg { width: 24px; height: 24px; }
.tab-item .tab-label {
  font-size: 11px;
  margin-top: 3px;
  font-weight: 500;
}
.tab-item.active .tab-label { font-weight: 600; }

/* 页面隐藏 */
.page { display: none; }
.page.active { display: block; }

/* 动画 */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.card { animation: fadeInUp 0.4s ease; }

/* 提示浮层 */
.toast {
  position: fixed;
  top: 90px;
  left: 50%;
  transform: translateX(-50%) translateY(-16px);
  background: rgba(45,45,45,0.88);
  backdrop-filter: blur(10px);
  color: #fff;
  padding: 10px 28px;
  border-radius: 24px;
  font-size: 14px;
  font-weight: 500;
  opacity: 0;
  transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  pointer-events: none;
  z-index: 100;
  letter-spacing: 0.5px;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="phone-frame">
  <div class="status-bar">
    <span>9:41</span>
    <span>📶 🔋</span>
  </div>

  <div class="content" id="content">
    <!-- 首页 -->
    <div class="page active" id="page-home">
      <div class="card">
        <div class="today-status" id="todayStatus">
          <div class="greeting">今天感觉怎么样？</div>
          <div class="sub-greeting">点选下方记录此刻心情</div>
          <div class="streak-badge">🔥 连续 5 天</div>
        </div>
        <div class="mood-selector" id="moodSelector">
          <div class="mood-btn bad" onclick="selectMood('bad')">
            <span class="emoji">😔</span>
            <span class="label">差</span>
            <span class="dot"></span>
          </div>
          <div class="mood-btn okay" onclick="selectMood('okay')">
            <span class="emoji">😐</span>
            <span class="label">中</span>
            <span class="dot"></span>
          </div>
          <div class="mood-btn good" onclick="selectMood('good')">
            <span class="emoji">😊</span>
            <span class="label">好</span>
            <span class="dot"></span>
          </div>
        </div>
      </div>

      <!-- 月度进度 -->
      <div class="progress-card" id="progressCard">
        <div class="progress-header">
          <span class="progress-label">本月记录</span>
          <span class="progress-value" id="progressValue">12/17天</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width:71%"></div>
        </div>
      </div>

      <div class="card">
        <div class="view-tabs">
          <div class="view-tab" onclick="switchView('week')">周</div>
          <div class="view-tab active" onclick="switchView('month')">月</div>
          <div class="view-tab" onclick="switchView('year')">年</div>
        </div>
        <div class="date-nav">
          <div class="nav-btn" onclick="navigateDate(-1)">‹</div>
          <div class="calendar-title" id="calendarTitle" onclick="goToday()">2026年六月</div>
          <div class="nav-btn" onclick="navigateDate(1)">›</div>
        </div>
        <div id="calendarContent"></div>
      </div>
    </div>

    <!-- 分析页 -->
    <div class="page" id="page-analysis">
      <div class="card">
        <div class="period-tabs">
          <div class="period-tab" onclick="switchPeriod('week')">本周</div>
          <div class="period-tab active" onclick="switchPeriod('month')">本月</div>
          <div class="period-tab" onclick="switchPeriod('year')">本年</div>
        </div>
      </div>
      <!-- 打卡统计卡片 -->
      <div class="stats-card-row">
        <div class="stats-card">
          <div class="stats-card-value">5</div>
          <div class="stats-card-label">连续打卡</div>
        </div>
        <div class="stats-card">
          <div class="stats-card-value">12</div>
          <div class="stats-card-label">最长连续</div>
        </div>
        <div class="stats-card">
          <div class="stats-card-value">87</div>
          <div class="stats-card-label">总记录</div>
        </div>
      </div>
      <div class="card">
        <div class="chart-header">
          <div class="title" id="chartTitle">本月心情分布</div>
          <div class="chart-toggle">
            <div class="chart-toggle-btn active" onclick="switchChart('pie')">饼图</div>
            <div class="chart-toggle-btn" onclick="switchChart('bar')">柱图</div>
          </div>
        </div>
        <div id="chartContent"></div>
      </div>
      <!-- 温馨小提示 -->
      <div class="tip-card" id="tipCard">
        <div class="tip-emoji" id="tipEmoji">🌸</div>
        <div class="tip-content">
          <div class="tip-title" id="tipTitle">温柔的一个月</div>
          <div class="tip-message" id="tipMessage">这个月大部分日子你都在微笑，生活正在回应你的温柔</div>
        </div>
      </div>
      <div class="card">
        <div class="chart-header"><div class="title">数据摘要</div></div>
        <div class="summary-row">
          <span class="summary-label">记录天数</span>
          <span class="summary-value" id="totalDays">18 天</span>
        </div>

function seededIndex(seed, length) {
  let hash = 0;
  for (let i = 0; i < seed.length; i++) {
    hash = ((hash << 5) - hash + seed.charCodeAt(i)) | 0;
  }
  return Math.abs(hash) % length;
}

function getMoodTip(stats, period) {
  if (stats.total <= 1) return null;
  const goodRatio = stats.total > 0 ? stats.good / stats.total : 0;
  const badRatio = stats.total > 0 ? stats.bad / stats.total : 0;

  if (stats.total <= 3) {
    const tips = MOOD_TIPS.sparse[period];
    return tips[seededIndex(period + '-' + stats.total, tips.length)];
  }
  if (goodRatio >= 0.3 && badRatio >= 0.3) {
    const tips = MOOD_TIPS.volatile[period];
    return tips[seededIndex(period + '-' + stats.total, tips.length)];
  }
  if (goodRatio >= 0.6) {
    const tips = MOOD_TIPS.goodMajority[period];
    return tips[seededIndex(period + '-' + stats.total, tips.length)];
  }
  if (badRatio >= 0.4) {
    const tips = MOOD_TIPS.badMajority[period];
    return tips[seededIndex(period + '-' + stats.total, tips.length)];
  }
  const tips = MOOD_TIPS.neutralMajority[period];
  return tips[seededIndex(period + '-' + stats.total, tips.length)];
}

function renderWeekView(container) {
  const today = new Date(2026, 5, 17);
  const dayOfWeek = today.getDay();
  const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
  const monday = new Date(today);
  monday.setDate(today.getDate() + mondayOffset);
  let html = '<div class="week-view"><div class="week-header">';
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    html += `<span>${WEEK_HEADERS[d.getDay() === 0 ? 6 : d.getDay() - 1]}</span>`;
  }
  html += '</div><div class="week-days">';
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const mood = mockData[dateStr];
    const isToday = dateStr === '2026-06-17';
    const bg = mood ? MOOD_COLORS[mood] : '#F0EDE8';
    const cls = `day-block${mood ? '' : ' empty'}${isToday ? ' today' : ''}`;
    html += `<div class="${cls}" style="background:${bg}">${d.getDate()}</div>`;
  }
  html += '</div></div>';
  container.innerHTML = html;
}

function renderMonthView(container) {
  const daysInMonth = new Date(viewYear, viewMonth, 0).getDate();
  const firstDay = new Date(viewYear, viewMonth - 1, 1).getDay();
  const startOffset = firstDay === 0 ? 6 : firstDay - 1;
  const todayDate = new Date(2026, 5, 17);

  let html = '<div class="month-view"><div class="month-header">';
  WEEK_HEADERS.forEach(h => html += `<span>${h}</span>`);
  html += '</div>';

  let cellIndex = 0;
  for (let row = 0; row < 6; row++) {
    let rowHtml = '<div class="month-row">';
    let hasContent = false;
    for (let col = 0; col < 7; col++) {
      if (cellIndex < startOffset) {
        rowHtml += '<div class="month-cell"></div>';
      } else {
        const day = cellIndex - startOffset + 1;
        if (day > daysInMonth) {
          rowHtml += '<div class="month-cell"></div>';
        } else {
          hasContent = true;
          const dateStr = `${viewYear}-${String(viewMonth).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
          const record = mockData[dateStr];
          const isToday = dateStr === '2026-06-17';
          const cellDate = new Date(viewYear, viewMonth - 1, day);
          const isFuture = cellDate > todayDate;
          let cls = 'month-circle';
          let bg;
          if (record) {
            cls += ' recorded';
            bg = MOOD_COLORS[record];
          } else if (isFuture) {
            cls += ' empty-future';
            bg = 'transparent';
          } else {
            cls += ' empty-past';
            bg = '#F0EDE8';
          }
          if (isToday) cls += ' today';
          rowHtml += `<div class="month-cell"><div class="${cls}" style="background:${bg}">${day}</div></div>`;
        }
      }
      cellIndex++;
    }
    rowHtml += '</div>';
    if (hasContent) html += rowHtml;
  }
  html += '</div>';
  container.innerHTML = html;
}

  Object.entries(mockData).forEach(([date, mood]) => {
    if (date >= start && date <= end) { stats[mood]++; stats.total++; }

  // 最常见心情
  const mostCommon = stats.total > 0

      : stats.okay >= stats.bad ? '中' : '差')

function renderPieChart(stats) {
  const size = 180, radius = 70, cx = size/2, cy = size/2;
  const circumference = 2 * Math.PI * radius;
  const total = stats.total || 1;
  const segments = [
    { level: 'bad', value: stats.bad },
    { level: 'okay', value: stats.okay },
    { level: 'good', value: stats.good },
  ];
  let offset = 0, paths = '';
  segments.forEach(seg => {
    const ratio = seg.value / total;
    const dashArray = `${ratio * circumference} ${(1 - ratio) * circumference}`;
    const rotation = offset * 360 - 90;
    offset += ratio;
    paths += `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="none"
      stroke="${MOOD_COLORS[seg.level]}" stroke-width="16"
      stroke-dasharray="${dashArray}"
      transform="rotate(${rotation} ${cx} ${cy})"
      stroke-linecap="round"/>`;
  });
  document.getElementById('chartContent').innerHTML = `
    <div class="pie-chart">
      <div class="pie-svg" style="position:relative;width:${size}px;height:${size}px">
        <svg width="${size}" height="${size}">${paths}</svg>
        <div class="pie-center">${stats.total}</div>
      </div>
      <div class="legend">
        ${segments.map(s => `
          <div class="legend-item">
            <div class="legend-dot" style="background:${MOOD_COLORS[s.level]}"></div>
            <span class="legend-label">${MOOD_LABELS[s.level]} ${s.value}天</span>
            <span class="legend-percent">${stats.total ? Math.round(s.value / total * 100) : 0}%</span>
          </div>
        `).join('')}
      </div>
    </div>`;
}

function renderBarChart(stats) {
  const maxVal = Math.max(stats.bad, stats.okay, stats.good, 1);
  const maxH = 120;
  const segments = [
    { level: 'bad', value: stats.bad },
    { level: 'okay', value: stats.okay },
    { level: 'good', value: stats.good },
  ];
  document.getElementById('chartContent').innerHTML = `
    <div class="bar-chart">
      ${segments.map(s => `
        <div class="bar-group">
          <div class="bar-value">${s.value}</div>
          <div class="bar" style="background:linear-gradient(180deg,${MOOD_GRADIENTS[s.level][0]},${MOOD_GRADIENTS[s.level][1]});height:${(s.value / maxVal) * maxH}px"></div>
          <div class="bar-label">${MOOD_LABELS[s.level]}</div>
        </div>
      `).join('')}
    </div>`;
}

function toggleNotification() {
  notifEnabled = !notifEnabled;
  document.getElementById('notifToggle').classList.toggle('on', notifEnabled);
  document.getElementById('timeRow').style.display = notifEnabled ? 'flex' : 'none';
  showToast(notifEnabled ? '已开启每日提醒' : '已关闭每日提醒');
}

function adjustTime(delta) {
  notifHour = Math.max(0, Math.min(23, notifHour + delta));
  document.getElementById('timeDisplay').textContent = `${String(notifHour).padStart(2,'0')}:00`;
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
}

// 初始化
renderCalendar();
renderChart();
updateProgress();
</script>
</body>
</html>

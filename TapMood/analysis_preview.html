<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一点心情 - 分析页预览</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  background: #F8F6F3;
  color: #2D2D2D;
  width: 390px;
  min-height: 844px;
  margin: 0 auto;
  -webkit-font-smoothing: antialiased;
  padding: 54px 0 0;
}
.card {
  background: #FFFFFF;
  margin: 12px 16px;
  border-radius: 20px;
  padding: 24px;
}
.period-tabs {
  display: flex;
  background: #F8F6F3;
  border-radius: 12px;
  padding: 3px;
}
.period-tab {
  flex: 1;
  padding: 8px 0;
  text-align: center;
  border-radius: 10px;
  font-size: 13px;
  color: #9E9E9E;
}
.period-tab.active {
  background: #FFFFFF;
  color: #2D2D2D;
  font-weight: 600;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.stats-card-row {
  display: flex;
  margin: 12px 16px;
  gap: 8px;
}
.stats-card {
  flex: 1;
  background: #FFFFFF;
  border-radius: 16px;
  padding: 16px 0;
  text-align: center;
}
.stats-card-value { font-size: 28px; font-weight: 700; color: #2D2D2D; }
.stats-card-label { font-size: 11px; color: #9E9E9E; margin-top: 4px; }
.chart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}
.chart-header .title { font-size: 18px; font-weight: 600; letter-spacing: 0.5px; }
.chart-toggle { display: flex; background: #F8F6F3; border-radius: 8px; padding: 2px; }
.chart-toggle-btn { padding: 5px 14px; border-radius: 6px; font-size: 12px; color: #9E9E9E; }
.chart-toggle-btn.active { background: #fff; color: #2D2D2D; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
.pie-chart { display: flex; flex-direction: column; align-items: center; padding: 16px 0; }
.pie-svg { position: relative; }
.pie-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 24px; font-weight: bold; color: #2D2D2D; }
.legend { width: 100%; margin-top: 20px; }
.legend-item { display: flex; align-items: center; margin-bottom: 10px; padding: 6px 0; }
.legend-dot { width: 14px; height: 14px; border-radius: 5px; margin-right: 10px; flex-shrink: 0; }
.legend-label { font-size: 14px; flex: 1; color: #2D2D2D; }
.legend-percent { font-size: 14px; color: #9E9E9E; font-weight: 600; }
.tip-card { display: flex; align-items: flex-start; background: #FFF9F5; margin: 12px 16px; border-radius: 16px; padding: 24px; }
.tip-emoji { font-size: 28px; margin-right: 16px; margin-top: 2px; flex-shrink: 0; }
.tip-content { flex: 1; }
.tip-title { font-size: 15px; font-weight: 600; color: #2D2D2D; margin-bottom: 4px; }
.tip-message { font-size: 13px; color: #9E9E9E; line-height: 20px; }
.summary-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #F8F6F3; }
.summary-row:last-child { border-bottom: none; }
.summary-label { font-size: 14px; color: #9E9E9E; }
.summary-value { font-size: 14px; font-weight: 600; color: #2D2D2D; }
.tab-bar { height: 72px; background: #FFFFFF; border-top: 1px solid #F0EDE8; display: flex; padding-bottom: 12px; position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 390px; }
.tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #BDBDBD; }
.tab-item.active { color: #2D2D2D; }
.tab-item svg { width: 24px; height: 24px; }
.tab-item .tab-label { font-size: 11px; margin-top: 3px; font-weight: 500; }
.tab-item.active .tab-label { font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="period-tabs">
    <div class="period-tab">本周</div>
    <div class="period-tab active">本月</div>
    <div class="period-tab">本年</div>
  </div>
</div>
<div class="stats-card-row">
  <div class="stats-card"><div class="stats-card-value">5</div><div class="stats-card-label">连续打卡</div></div>
  <div class="stats-card"><div class="stats-card-value">12</div><div class="stats-card-label">最长连续</div></div>
  <div class="stats-card"><div class="stats-card-value">87</div><div class="stats-card-label">总记录</div></div>
</div>
<div class="card">
  <div class="chart-header">
    <div class="title">本月心情分布</div>
    <div class="chart-toggle">
      <div class="chart-toggle-btn active">饼图</div>
      <div class="chart-toggle-btn">柱图</div>
    </div>
  </div>
  <div class="pie-chart">
    <div class="pie-svg" style="position:relative;width:180px;height:180px">
      <svg width="180" height="180">
        <circle cx="90" cy="90" r="70" fill="none" stroke="#7986CB" stroke-width="16" stroke-dasharray="88 352" transform="rotate(-90 90 90)" stroke-linecap="round"/>
        <circle cx="90" cy="90" r="70" fill="none" stroke="#FFB74D" stroke-width="16" stroke-dasharray="132 308" transform="rotate(45 90 90)" stroke-linecap="round"/>
        <circle cx="90" cy="90" r="70" fill="none" stroke="#81C784" stroke-width="16" stroke-dasharray="220 220" transform="rotate(157 90 90)" stroke-linecap="round"/>
      </svg>
      <div class="pie-center">17</div>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#7986CB"></div><span class="legend-label">差 3天</span><span class="legend-percent">18%</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#FFB74D"></div><span class="legend-label">中 5天</span><span class="legend-percent">29%</span></div>
      <div class="legend-item"><div class="legend-dot" style="background:#81C784"></div><span class="legend-label">好 9天</span><span class="legend-percent">53%</span></div>
    </div>
  </div>
</div>
<div class="tip-card">
  <div class="tip-emoji">🌸</div>
  <div class="tip-content">
    <div class="tip-title">温柔的一个月</div>
    <div class="tip-message">这个月大部分日子你都在微笑，生活正在回应你的温柔</div>
  </div>
</div>
<div class="card">
  <div class="chart-header"><div class="title">数据摘要</div></div>
  <div class="summary-row"><span class="summary-label">记录天数</span><span class="summary-value">17 天</span></div>
  <div class="summary-row"><span class="summary-label">最常见心情</span><span class="summary-value">好</span></div>
  <div class="summary-row"><span class="summary-label">心情好的占比</span><span class="summary-value">53%</span></div>
  <div class="summary-row"><span class="summary-label">心情差的占比</span><span class="summary-value">18%</span></div>
</div>
<div class="tab-bar">
  <div class="tab-item"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/></svg><span class="tab-label">记录</span></div>
  <div class="tab-item active"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="6" width="4" height="15" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg><span class="tab-label">分析</span></div>
  <div class="tab-item"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg><span class="tab-label">设置</span></div>
</div>
</body>
</html>
